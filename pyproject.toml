[project]
name = "hermes-privacy-gateway"
version = "0.1.0"
description = "Local PII pseudonymization middleware for Hermes Agent"
requires-python = ">=3.14,<3.15"
dependencies = [
  "presidio-analyzer[langextract]>=2.2.364,<2.3",
  "presidio-anonymizer>=2.2.364,<2.3",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
